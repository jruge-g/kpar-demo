<!DOCTYPE html>
<html>
<head>
	<title> Tablas </title>
</head>
<body>

	<h2> TABLAS EN HTML </h2>

	<h3> Tabla Basica </h3>

		<table border="5" align="center" width="200" height=200>
			<tr>
				<td align="center">A</td>
				<td align="center">B</td>
			</tr>
			<tr>
				<td align="center">C</td>
				<td align="center">D</td>
			</tr>
			<tr>
				<td align="center">E</td>
				<td align="center">F</td>
			</tr>
		</table>
		<h3> Tabla con colores </h3>

		<table border="10" align="center" width="400" height=500>
			<tr height=200><td bgcolor="yellow"></td></tr>
			<tr height=150><td bgcolor="blue"></td></tr>
			<tr height=150><td bgcolor="red"></td></tr>
		</table>

		<h3> Tabla con titulos </h3>
		<table border="5" align="center" width="300">
			<tr>
				<th>Lenguaje</th>
			</tr>
			<tr>
				<td align="center">HTML</td>
			</tr>
			<tr>
				<td align="center">CSS</td>
			</tr>
			<tr>
				<td align="center">JavaScript</td>
			</tr>
			<tr>
				<td align="center">Php</td>
			</tr>
			<tr>
				<td align="center">Python</td>
			</tr>
		</table>

</body>
</html>
